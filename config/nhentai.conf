
#agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:144.0) Gecko/20100101 Firefox/144.0"

#patterns = ["^(http|https)://([A-Za-z0-9.-]+)(:[0-9]+)?(/[^?]+)?(\?.*)?$"]
patterns = [
  # hardcoded in NHentaiHandler.scala
  #"nhentai://(\\d+)",
  "https://nhentai\\.net/g/(\\d+)/"
]

default-location = "https://nhentai.net"


cloudflare {
  strategy = "provided-cookies"
  #Only provided-cookies currently
  ##strategy = "playwright"
  provided-cookies = ""
}

parsing {
  implementation = "jsoup"
}

download {

  parallel-pages = 2

  file-signature-check {

    enabled = true

    fallback-extension-name = "unknownfile"
  }

}